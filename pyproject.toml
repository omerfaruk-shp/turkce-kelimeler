[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-kelimeler"
version = "0.1.0"
description = "Türkçe kelime listesi ve dil işleme yardımcıları (hecele, ek getirme, İ/ı dönüşümü)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["turkish", "türkçe", "nlp", "words"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turkcekit = ["data/*.txt"]
